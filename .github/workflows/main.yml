name: Poka-Yoke Build Gate

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint:
    name: Lint & Format Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install black==26.5.1

      - name: Run Flake8
        run: |
          flake8 django/ --max-line-length=100

      - name: Check Code Formatting
        run: |
          black --check django/

  secret-scan:
    name: Secret Scan Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"
        with:
          config-path: gitleaks.toml

      - name: Fail if Secrets Found
        if: failure()
        run: |
          echo "::error::Security scan failed. Secrets detected."
          exit 1

  build:
    name: Build Docker Image
    needs:
      - lint
      - secret-scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Dockerfile
        run: |
          ls -la
          ls -la django

      - name: Build Docker Image
        run: |
          docker build \
            -t habotconnect-backend:${{ github.sha }} \
            -t habotconnect-backend:latest \
            ./django

      - name: Verify Docker Image
        run: |
          docker images
