name: Poka-Yoke Build Gate

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black==26.5.1

      - name: Run Flake8
        run: |
          flake8 django/ --max-line-length=100

      - name: Check Code Formatting
        run: |
          black --check django/

 secret-scan:
  name: Secret Scan Gate
  runs-on: ubuntu-latest

  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_ENABLE_COMMENTS: "false"
        GITLEAKS_CONFIG: gitleaks.toml
  build:
    name: Build Docker Image
    needs:
      - lint
      - secret-scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Project Structure
        run: |
          ls -la
          ls -la django

      - name: Build Docker Image
        run: |
          docker build \
            -t habotconnect-backend:${{ github.sha }} \
            -t habotconnect-backend:latest \
            ./django

      - name: List Docker Images
        run: docker images

      - name: Save Docker Image
        run: |
          docker save \
            habotconnect-backend:${{ github.sha }} \
            -o habotconnect-backend.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: habotconnect-backend.tar

  verify-image:
    name: Verify Docker Artifact
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: |
          docker load -i habotconnect-backend.tar

      - name: List Docker Images
        run: docker images

      - name: Inspect Docker Image
        run: |
          docker image inspect habotconnect-backend:${{ github.sha }}

      - name: Verify Image Exists
        run: |
          docker image ls | grep habotconnect-backend
